# MS20XXL: every push builds the plugin (armv7 and aarch64) and the skin, runs the offline tests, packages the release zips,
# checks them (catalog_check + `sh -n` on install.sh/uninstall.sh, the L'Cronx apostrophe) and keeps them as a run
# artifact. "Run workflow" with a version also publishes the GitHub release with those zips: pushing a v* tag does the same.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.1.2 (empty = build only)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools (Pillow, numpy, Zig)
        run: python3 -m pip install --quiet pillow numpy ziglang
      - name: Build
        run: ./build.sh
      - name: Offline tests (engine under ASan/UBSan, host test)
        run: bash test/run_tests.sh
      # 0.2.0: the zips as the Open MPC catalog reads them, made with the open-mpc release tools (third_party/open-mpc-release,
      # with the L'Cronx apostrophe shell-escaped): -mpc-armv7.zip (Force and the 32-bit MPCs), -mpc-aarch64.zip (the 64-bit
      # MPCs) and -mpc-sdk.zip (Akai's one-folder format, MPC OS 3.10.1 or later).
      - name: Package
        run: |
          V="${{ inputs.version }}"; [ "$GITHUB_REF_TYPE" = tag ] && V="${GITHUB_REF_NAME#v}"; V="${V:-0.0.${GITHUB_RUN_NUMBER}}"; echo "VERSION=$V" >> "$GITHUB_ENV"   # catalog versions are X.Y.Z; CI-only builds are 0.0.<run>
          for A in arm arm64; do
            python3 third_party/open-mpc-release/release.py --so build/$A/ms20xxl.so \
              --skin "build/skin/L'Cronx - VST - MS20XXL" --entry build/pluginlist-entry.xml --version "$V" \
              --about "Korg MS-20-style semi-modular mono synth, circuit-modelled from the MS-20 schematics, with an SQ-10-style step sequencer and a touch patch panel" \
              --repo sunskiefer/MS20XXL --license GPL-3.0-or-later --id ms20xxl -o dist
          done
          python3 third_party/open-mpc-release/sdk_zip.py "dist/MS20XXL-$V-mpc-sdk.zip" "dist/MS20XXL-$V-mpc-armv7.zip" "dist/MS20XXL-$V-mpc-aarch64.zip"
          python3 third_party/open-mpc-release/catalog_check.py dist/*-mpc-armv7.zip --catalog
          python3 third_party/open-mpc-release/catalog_check.py dist/*-mpc-aarch64.zip --catalog
          # a version not yet in tested.json (not tried on a device) is published as a pre-release
          python3 -c "import json,sys; print('PRERELEASE=' + ('false' if any(e['version']==sys.argv[1] for e in json.load(open('tested.json'))) else 'true'))" "$V" >> "$GITHUB_ENV"
      - name: Installer syntax (sh -n) and the L'Cronx apostrophe
        run: |
          set -e
          for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
            d=$(mktemp -d); unzip -q "$z" -d "$d"
            find "$d" \( -name install.sh -o -name uninstall.sh \) -print0 | while IFS= read -r -d '' s; do
              sh -n "$s" && echo "sh -n OK: $s"
            done
            n=$(find "$d" \( -name install.sh -o -name uninstall.sh \) | wc -l); [ "$n" -ge 2 ] || { echo "installer missing in $z"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MS20XXL-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 30
      - name: Publish release (tag push v*, or Run workflow with a version)
        if: ${{ github.ref_type == 'tag' || inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MS20XXL ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          draft: false
          files: dist/*.zip
          body: "MS20XXL for Force / MPC OS by L'Cronx. -mpc-armv7.zip: Force and the 32-bit MPCs. -mpc-aarch64.zip: the 64-bit MPCs (Live III, XL, One G2, Key G2). Install either: unzip, run install.sh (INSTALL.md inside), or use the MPC plugin installer. -mpc-sdk.zip: MPC OS 3.10.1 or later, any MPC: copy the folder into VST2 Plugins."
